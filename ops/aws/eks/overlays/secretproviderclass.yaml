# SecretsStore CSI Driver + AWS provider: source the DB password from AWS
# Secrets Manager and sync it into a Kubernetes Secret named `sangyshop-db`
# (the SAME name the base manifest mounts), so the file contract at
# /run/secrets/db_password is preserved end-to-end.
#
# Flow:
#   Secrets Manager secret (__SECRET_ARN__)
#     -> SecretsStore CSI volume (mounted by the Deployment, see app-rds.yaml)
#     -> secretObjects syncs it into K8s Secret `sangyshop-db` key `db_password`
#     -> base Deployment mounts that Secret as a FILE at /run/secrets/db_password
#
# This replaces the base manifest's hand-authored Opaque Secret source. The
# base Secret object itself stays defined (placeholder) but is overwritten /
# kept in sync by the CSI driver at runtime; DB_PASSWORD is NEVER an env var.
#
# Requires: SecretsStore CSI Driver + aws-secrets-manager provider installed
# and an IRSA role bound to the `sangyshop` ServiceAccount granting read on the
# secret (deploy.ps1 wires the IRSA annotation; RBAC in the base is untouched).
#
# PLACEHOLDERS __AWS_REGION__ and __SECRET_ARN__ are substituted by deploy.ps1.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: sangyshop-db
  namespace: sangyshop-hardened
spec:
  provider: aws
  parameters:
    region: __AWS_REGION__
    objects: |
      - objectName: "__SECRET_ARN__"
        objectType: "secretsmanager"
        objectAlias: "db_password"
  # Sync the pulled secret into a K8s Secret of the SAME name the base mounts.
  secretObjects:
    - secretName: sangyshop-db
      type: Opaque
      data:
        - objectName: "db_password"   # the objectAlias above
          key: db_password            # -> Secret key the base volume reads
