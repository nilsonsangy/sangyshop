# Secret source for GKE: GCP Secret Manager via the Secrets Store CSI driver
# (GCP provider). The driver reads the `db_password` secret from Secret Manager
# and both (a) mounts it as a file and (b) syncs it into a Kubernetes Secret
# named `sangyshop-db` with key `db_password`.
#
# The hardened base manifest already declares a `db-secret` volume that projects
# key `db_password` to the path `db_password` under /run/secrets, so the app
# still reads /run/secrets/db_password with NO changes to the app image. The
# patch (patch-deployment.yaml) points that volume at the CSI-synced Secret and
# adds the CSI inline volume that triggers the sync.
#
# Prerequisites handled by gcp/kubernetes/deploy.ps1 (task 7.2):
#   - Secrets Store CSI driver + GCP provider installed on the GKE cluster
#   - Workload Identity bound so the sangyshop ServiceAccount can access the
#     Secret Manager secret
#
# PLACEHOLDERS substituted by the deploy script:
#   __GCP_PROJECT_ID__  project that owns the secret
#   __GSM_SECRET__      Secret Manager secret name (default: db_password)
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: sangyshop-db-gsm
  namespace: sangyshop-hardened
spec:
  provider: gcp
  parameters:
    secrets: |
      - resourceName: "projects/__GCP_PROJECT_ID__/secrets/__GSM_SECRET__/versions/latest"
        path: "db_password"
  # Sync the mounted secret into a K8s Secret so the existing `db-secret`
  # volume (secretName: sangyshop-db, key: db_password) resolves unchanged.
  secretObjects:
    - secretName: sangyshop-db
      type: Opaque
      data:
        - objectName: "db_password"
          key: "db_password"
