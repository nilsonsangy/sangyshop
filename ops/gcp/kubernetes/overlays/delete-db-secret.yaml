# Remove the base placeholder `sangyshop-db` Secret. On GKE the password is
# delivered from GCP Secret Manager through the Secrets Store CSI driver, which
# synthesizes a `sangyshop-db` Secret (see secret-provider-class.yaml). The
# committed placeholder must not shadow the CSI-synced one.
$patch: delete
apiVersion: v1
kind: Secret
metadata:
  name: sangyshop-db
  namespace: sangyshop-hardened
