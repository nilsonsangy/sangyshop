# HARDENED run of the same app. Compare with the repo's default (insecure) compose at the root.
#
# Its OWN isolated Compose project (name: sangyshop-hardened), separate from the insecure
# one (name: sangyshop-insecure). Separate network and volumes mean the two variants are
# fully isolated and neither `docker compose` command affects the other. In Docker Desktop
# this variant appears as the `sangyshop-hardened` group; its containers are
# sangyshop-app-hardened and sangyshop-db-hardened.
#
# SECURE PATTERN (teaching): the PostgreSQL credentials (DB_Secret) are NOT kept in
# plaintext here. The password is provided through the Docker `secrets` mechanism,
# sourced from the local db_password.txt (git-ignored). Postgres reads it via
# POSTGRES_PASSWORD_FILE and the app reads it from /run/secrets/db_password in
# hardened mode (R5.2/R5.3/R5.4/R9.3). No plaintext DB_PASSWORD anywhere.
name: sangyshop-hardened

services:
  db:
    image: postgres:16
    container_name: sangyshop-db-hardened
    environment:
      # Non-secret connection parameters only. The password comes from the Docker
      # secret file below, never from a plaintext env var.
      POSTGRES_USER: sangyshop
      POSTGRES_DB: sangyshop
      # Postgres reads the password from the mounted secret file (R5.4), not from
      # a plaintext POSTGRES_PASSWORD env var.
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      # Named volume keeps the data across container restarts (Data_Volume, R1.2).
      - db-data:/var/lib/postgresql/data
    secrets:
      - db_password                      # same secret consumed by the app
    ports:
      # Published for optional external inspection of the hardened database.
      - "7011:5432"
    restart: unless-stopped

  app:
    build:
      context: ../../..
      dockerfile: ops/docker/hardened/Dockerfile
    image: sangyshop:hardened
    container_name: sangyshop-app-hardened
    depends_on:
      - db
    user: "10001"                        # non-root
    read_only: true                      # immutable root filesystem
    cap_drop:
      - ALL                              # drop every Linux capability
    security_opt:
      - no-new-privileges:true           # block privilege escalation
      - seccomp=./seccomp.json           # restrict syscalls (default-like profile)
    # The app writes two paths at runtime: config/defenses.json (Defenses panel) and a
    # logs/ directory. Those two paths stay writable; the rest of the root FS is read-only.
    tmpfs:
      - /tmp
    volumes:
      - app-config:/app/config
      - app-logs:/app/logs
    environment:
      # Hardened mode: the DB password is read from /run/secrets/db_password by
      # src/db/credentials.js, never from a plaintext env var (R5.1/R5.2). Only the
      # non-secret connection parameters are passed here.
      - APP_MODE=hardened
      - DB_BACKEND=pg
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=sangyshop
      - DB_USER=sangyshop
    secrets:
      - db_password                      # provided out-of-band, not baked into the image
    mem_limit: 256m                      # cgroup memory cap
    cpus: 0.5                            # cgroup cpu cap
    pids_limit: 128
    ports:
      - "7010:3000"
    restart: unless-stopped

volumes:
  app-config:
  app-logs:
  db-data:                               # PostgreSQL persistence (R1.2)

secrets:
  db_password:
    file: ./db_password.txt              # local file, git-ignored; never commit the real value