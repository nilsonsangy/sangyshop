# Secret source for AKS: Azure Key Vault via the Secrets Store CSI driver
# (Azure Key Vault provider / AKS azure-keyvault-secrets-provider addon). The
# driver reads the DB-password secret from Key Vault and both (a) mounts it as
# a file and (b) syncs it into a Kubernetes Secret named `sangyshop-db` with
# key `db_password`.
#
# The hardened base manifest already declares a `db-secret` volume that projects
# key `db_password` to the path `db_password` under /run/secrets, so the app
# still reads /run/secrets/db_password with NO changes to the app image. The
# patch (patch-deployment.yaml) points that volume at the CSI-synced Secret and
# adds the CSI inline volume that triggers the sync.
#
# Prerequisites handled by azure/kubernetes/deploy.ps1 (task 12.2):
#   - AKS created with the `azure-keyvault-secrets-provider` addon (Secrets
#     Store CSI driver + Azure Key Vault provider)
#   - A user-assigned managed identity granted `get` on the Key Vault secret and
#     bound to the workload (its client id is __KV_IDENTITY_CLIENTID__)
#
# PLACEHOLDERS substituted by the deploy script:
#   __KEYVAULT_NAME__           the Azure Key Vault name that owns the secret
#   __KV_SECRET__               the Key Vault secret name (default: db-password)
#   __KV_TENANT_ID__            the Azure AD tenant id of the Key Vault
#   __KV_IDENTITY_CLIENTID__    client id of the user-assigned managed identity
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: sangyshop-db-akv
  namespace: sangyshop-hardened
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: "__KV_IDENTITY_CLIENTID__"
    keyvaultName: "__KEYVAULT_NAME__"
    tenantId: "__KV_TENANT_ID__"
    objects: |
      array:
        - |
          objectName: __KV_SECRET__
          objectType: secret
          objectAlias: db_password
  # Sync the mounted secret into a K8s Secret so the existing `db-secret`
  # volume (secretName: sangyshop-db, key: db_password) resolves unchanged.
  secretObjects:
    - secretName: sangyshop-db
      type: Opaque
      data:
        - objectName: "db_password"   # the objectAlias above
          key: "db_password"          # -> Secret key the base volume reads
