# INSECURE ON PURPOSE - teaching baseline.
# Privileged, root, no resource limits, secret in plaintext env. Compare with ../hardened.
services:
  sangyshop:
    build:
      context: ../../..
      dockerfile: deployment-security/docker/insecure/Dockerfile
    image: sangyshop:insecure
    container_name: sangyshop-insecure
    privileged: true                 # hands almost full host power to the container
    environment:
      - PORT=3000
      - DB_PASSWORD=S3cr3t-in-plaintext   # secret baked into the manifest (leaks everywhere)
    ports:
      - "3000:3000"
    # no cap_drop, no security_opt, no read_only, no mem/cpu limits
    restart: unless-stopped
