# INSECURE ON PURPOSE - teaching baseline for Kubernetes.
# Privileged Pod, hostPath/hostNetwork, cluster-admin RBAC, plaintext secret,
# no NetworkPolicy, namespace without Pod Security Standards.
# Compare with ../hardened/sangyshop-hardened.yaml.
---
apiVersion: v1
kind: Namespace
metadata:
  name: sangyshop-insecure
  # NO pod-security.kubernetes.io/* labels: admission does not block unsafe Pods.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sangyshop
  namespace: sangyshop-insecure
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sangyshop-insecure-admin
# Binds the app's ServiceAccount to cluster-admin: whoever steals the pod token owns the cluster.
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: sangyshop
    namespace: sangyshop-insecure
---
# Plaintext DB password in a versioned manifest (antipattern). Both the app and
# the PostgreSQL service below read this exact plaintext value.
apiVersion: v1
kind: Secret
metadata:
  name: sangyshop-db
  namespace: sangyshop-insecure
type: Opaque
stringData:
  DB_PASSWORD: "S3cr3t-in-plaintext"   # plaintext in a versioned manifest
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sangyshop
  namespace: sangyshop-insecure
  labels: { app: sangyshop }
spec:
  replicas: 2
  # hostNetwork: true faz cada Pod ocupar a porta do no; com 2 replicas em
  # poucos nos, RollingUpdate nao acha porta livre e trava. Recreate derruba
  # os Pods antigos primeiro, liberando a porta, e so entao recria.
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: sangyshop }
  template:
    metadata:
      labels: { app: sangyshop }
    spec:
      serviceAccountName: sangyshop
      hostNetwork: true          # shares the node network
      hostPID: true              # sees the node processes
      containers:
        - name: sangyshop
          image: sangyshop:insecure   # the repo's default build (root Dockerfile / docker compose)
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            # Vulnerable mode: credentials come from plaintext env (antipattern).
            # The app (src/db/credentials.js, vulnerable mode) reads DB_PASSWORD
            # straight from the environment, never from a mounted secret file.
            - name: APP_MODE
              value: "vulnerable"
            - name: DB_BACKEND
              value: "pg"
            - name: DB_HOST
              value: "sangyshop-db"      # the PostgreSQL Service below
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "sangyshop"
            - name: DB_USER
              value: "sangyshop"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: sangyshop-db, key: DB_PASSWORD }
            # Downward API: inject the Pod name so the homepage can show which
            # Pod served the request (badge appears only when running in k8s).
            - name: POD_NAME
              valueFrom:
                fieldRef: { fieldPath: metadata.name }
          securityContext:
            privileged: true            # near-total power over the node
            runAsUser: 0                # root
            allowPrivilegeEscalation: true
          volumeMounts:
            - name: host-root
              mountPath: /host          # mounts the node filesystem into the Pod
          # no resources.requests/limits
      volumes:
        - name: host-root
          hostPath:
            path: /
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: sangyshop
  namespace: sangyshop-insecure
spec:
  selector: { app: sangyshop }
  ports:
    - port: 3000
      targetPort: 3000
# No NetworkPolicy anywhere: every Pod can talk to every other Pod.
---
# PostgreSQL (insecure): plaintext password via env, no resource limits, runs as
# the image default (root). Matches the vulnerable docker-compose at the repo root.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sangyshop-db-data
  namespace: sangyshop-insecure
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sangyshop-db
  namespace: sangyshop-insecure
  labels: { app: sangyshop-db }
spec:
  serviceName: sangyshop-db
  replicas: 1
  selector:
    matchLabels: { app: sangyshop-db }
  template:
    metadata:
      labels: { app: sangyshop-db }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "sangyshop"
            - name: POSTGRES_USER
              value: "sangyshop"
            # Plaintext password straight from the env (antipattern), sourced
            # from the same plaintext Secret the app uses.
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: sangyshop-db, key: DB_PASSWORD }
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql/data
          # no resources.requests/limits
      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: sangyshop-db-data
---
apiVersion: v1
kind: Service
metadata:
  name: sangyshop-db
  namespace: sangyshop-insecure
spec:
  selector: { app: sangyshop-db }
  ports:
    - port: 5432
      targetPort: 5432
